name: Build Installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: lianqiao-windows
          path: desktop/release/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Sync web assets
        working-directory: mobile
        run: npx cap sync android
      - name: Build Android APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lianqiao-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          windows_file=$(find release-assets -maxdepth 1 -name '*.exe' | head -n 1)
          android_file=$(find release-assets -maxdepth 1 -name '*.apk' | head -n 1)
          test -n "$windows_file"
          test -n "$android_file"
          mv "$windows_file" release-assets/lianqiao-windows-setup.exe
          mv "$android_file" release-assets/lianqiao-android.apk
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --title "连桥 v1.0.0" --notes "Windows 桌面端与 Android 移动端安装包"
          gh release upload v1.0.0 release-assets/lianqiao-windows-setup.exe release-assets/lianqiao-android.apk --clobber
